[project]
name = "repoute"
version = "0.0.1"
description = "레포를 읽는 길을 안내하는 코드 읽기 가이드"
requires-python = ">=3.11"
dependencies = [
    "langchain",
    "langchain-core",
    "langchain-openai",
    "langchain-anthropic",
    "langgraph",
    "langgraph-checkpoint-sqlite",
    "langsmith",
    "networkx",
    "python-dotenv",
    "scipy>=1.17.1",
]

[project.scripts]
repoute = "repoute.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repoute"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["*.md"]  # 문서 안의 코드 블록은 설명용이라 포맷 검사 제외

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
